<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autumn Club · A1+/A2</title><style>:root{--bg:#f7f1e6;--ink:#2f2925;--forest:#375b4a;--rust:#b65c36;--gold:#e9b968}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}header{position:sticky;top:0;background:var(--forest);color:white;padding:12px 5%;display:flex;gap:15px;align-items:center;flex-wrap:wrap;z-index:2}header a{color:white}main{max-width:1020px;margin:auto;padding:25px 16px 90px}.hero{background:var(--gold);border:3px solid var(--ink);border-radius:28px;padding:40px}h1{font-size:clamp(50px,9vw,104px);line-height:.94;letter-spacing:-.06em;margin:15px 0}h2{font-size:clamp(30px,5vw,48px);line-height:1.1}button,input,textarea{font:inherit}button{background:#fff;border:2px solid var(--ink);border-radius:13px;padding:10px 15px;cursor:pointer;min-height:44px}button:hover{background:var(--gold)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--rust)}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.nav button{font-weight:700}section{display:none;background:#fffdf8;border:2px solid var(--ink);border-radius:24px;padding:25px;min-height:480px}section.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.card{border:2px solid var(--ink);border-radius:15px;background:#f3e8d7;padding:18px}.card b{display:block}.emoji{font-size:42px}.task{background:#e8eee6;padding:18px;border-left:6px solid var(--forest);border-radius:10px;margin:18px 0}.choices{display:flex;gap:10px;flex-wrap:wrap}.choices button.sel{background:var(--gold)}textarea,input{width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px;min-height:48px}textarea{min-height:130px}.feedback{font-weight:800;min-height:28px}.tutor{background:var(--forest);color:white;padding:18px;border-radius:16px;margin:18px 0}details{padding:12px;background:#f8edcf;border-radius:10px;margin:12px 0}summary{cursor:pointer;font-weight:700}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}a{color:var(--forest)}@media(max-width:600px){.hero{padding:24px}section{padding:18px}header{position:static}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style><body><header><a href="../">← Main site</a><b>🍂 AUTUMN CLUB</b><span id="count"></span><button onclick="reset()">New student / Reset all</button></header><main><div class="hero"><b>90 MIN · GRADES 6–8 · A1+/A2</b><h1>COZY DAYS.<br>WILD PLANS.</h1><p>Autumn break is coming. Plan your dream holiday, investigate British traditions and survive some ridiculous surprises.</p><button onclick="go(0)">START THE QUEST →</button></div><div class="nav" id="nav"></div><div id="content"></div></main><script>
const words=[['👫','hang out with friends'],['🍔','order takeaway'],['🎬','go to the cinema'],['🎮','play video games'],['🎃','carve a pumpkin'],['🚆','go on a day trip'],['👻','watch a horror film'],['🏡','visit relatives']];
const tasks=[
['8 min','THE AUTUMN VIBE','Warm-up','<p>Would you rather stay home or go out with friends during the holidays? Why?</p><div class="choices" data-pick="mood"><button>🍿 Movie night</button><button>🍔 Fast food trip</button><button>🎮 Gaming marathon</button><button>🎃 Halloween party</button></div><div class="tutor">STUDENT TURN: Explain your choice in two sentences. TUTOR FOLLOW-UP: What would make this day perfect?</div>'],
['12 min','THE HOLIDAY MENU','Vocabulary','<p>Tap to hear each phrase. Repeat, then cover the words and recall five activities.</p><div class="cards" id="vocab"></div><div class="tutor">ASK YOUR TUTOR: Which activity do you prefer? Why? Then use two phrases in your own sentences.</div>'],
['10 min','THE BURGER BATTLE','Speaking','<p>Plan a holiday lunch. Which is better: McDonald’s, KFC, pizza or a homemade meal?</p><div class="choices" data-pick="food"><button>🍔 McDonald’s</button><button>🍗 KFC</button><button>🍕 Pizza</button><button>🥪 Homemade food</button></div><div class="task">Explain your choice. Use: I would rather ... because ...<textarea data-save="food" placeholder="I would rather ... because ..."></textarea></div><div class="tutor">EXTRA CHALLENGE: Would you eat 100 chicken nuggets for a million dollars? Give two reasons!</div>'],
['12 min','BACK TO LAST AUTUMN','Past Simple','<p>Listen to the story before reading it.</p><button onclick="say(story)">🔊 Play story</button><details><summary>Reveal the story after listening</summary><p>Last autumn, Alex met friends at the cinema. They watched a mystery film and ordered burgers afterwards. Alex forgot his wallet, so his friend paid. It was embarrassing but funny!</p></details><div class="task"><b>Choose the correct past form:</b><p>Alex ___ his friends at the cinema.</p><div class="choices" data-correct="met"><button>meet</button><button>met</button><button>meeting</button></div><p class="feedback"></p><details><summary>Hint</summary>meet → met</details></div><div class="tutor">STUDENT TURN: Tell your tutor about three things you did last holiday. TUTOR FOLLOW-UP: Where did you go? Who did you meet?</div>'],
['10 min','THE BRITISH CULTURE FILE','Halloween & Bonfire Night','<p>In the UK, some people celebrate Halloween on 31 October. Children may wear costumes, carve pumpkins and go trick-or-treating. Bonfire Night is on 5 November; people may watch fireworks at organised events.</p><div class="cards"><div class="card"><span class="emoji">🎃</span><b>Halloween</b>31 October<button onclick="say(\'Some children wear costumes and go trick or treating.\')">🔊 Listen</button></div><div class="card"><span class="emoji">🎆</span><b>Bonfire Night</b>5 November<button onclick="say(\'People may watch fireworks on Bonfire Night.\')">🔊 Listen</button></div></div><div class="task"><p>Which festival is on 5 November?</p><div class="choices" data-correct="Bonfire Night"><button>Halloween</button><button>Bonfire Night</button><button>Christmas</button></div><p class="feedback"></p><details><summary>Hint</summary>Think about fireworks.</details></div><div class="tutor">COMPARE CULTURES: Do people celebrate these festivals where you live? Which autumn tradition would you like to try?</div>'],
['12 min','FUTURE YOU','Be going to','<p>Read: I am going to meet friends. She is going to watch a film. We are going to order pizza.</p><div class="task"><p>Complete: We ___ going to carve a pumpkin.</p><div class="choices" data-correct="are"><button>am</button><button>is</button><button>are</button></div><p class="feedback"></p><details><summary>Hint</summary>We + are + going to + base verb.</details></div><div class="task"><p>Write two real plans for your next break.</p><textarea data-save="plans" placeholder="I am going to ... because ..."></textarea><button onclick="say(document.querySelector(\'[data-save=plans]\').value)">🔊 Listen to my plan</button></div><div class="tutor">ASK YOUR TUTOR: What are you going to do next weekend? PRONUNCIATION: going to is often reduced in speech, but write the full form.</div>'],
['10 min','PAST OR FUTURE?','Time machine','<p>Help the squirrel repair the timeline.</p><div class="task"><p>Yesterday I ___ pizza.</p><div class="choices" data-correct="ate"><button>eat</button><button>ate</button><button>am going to eat</button></div><p class="feedback"></p><details><summary>Hint</summary>Yesterday = past.</details></div><div class="task"><p>Tomorrow I ___ my friends.</p><div class="choices" data-correct="am going to meet"><button>met</button><button>am going to meet</button><button>meet yesterday</button></div><p class="feedback"></p><details><summary>Hint</summary>Tomorrow = future plan.</details></div>'],
['10 min','CHAOS CHALLENGE','Random speaking game','<p>Generate a random plot twist. Tell a short story in the past, then make a future plan to fix the problem.</p><div class="card"><div class="emoji" id="emoji">🎲</div><h2 id="twist">Ready?</h2><button onclick="roll()">ROLL THE CHAOS →</button></div><div class="tutor">SWITCH ROLES: The tutor tells a story and the student asks two follow-up questions. Use Did you ...? and Are you going to ...?</div>'],
['6 min','THE ULTIMATE BREAK','Final task & reflection','<p>Pitch your ideal three-day autumn break. Include two past memories, three future plans, one British autumn tradition and a funny surprise.</p><textarea data-save="final" placeholder="Last autumn I ... Next week I am going to ..."></textarea><div class="tutor">TUTOR CHECKLIST: past forms ✓ future plans ✓ reasons ✓ follow-up questions ✓. Do not automatically mark speaking as correct or incorrect.</div><p><a href="https://learnenglishkids.britishcouncil.org/category/topics/halloween" target="_blank" rel="noopener noreferrer">Optional authentic Halloween activities · British Council ↗</a></p>']
];
const story='Last autumn, Alex met friends at the cinema. They watched a mystery film and ordered burgers afterwards. Alex forgot his wallet, so his friend paid. It was embarrassing but funny!';
let state={index:0,answers:{},choices:{},roll:-1};try{state={...state,...JSON.parse(localStorage.getItem('autumnclub-a2')||'{}')}}catch(e){}
const save=()=>localStorage.setItem('autumnclub-a2',JSON.stringify(state));
function say(t){if(!t||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.86;speechSynthesis.speak(u)}
function go(n){state.index=Math.max(0,Math.min(tasks.length-1,n));save();document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('active',i===state.index));document.getElementById('count').textContent='Mission '+(state.index+1)+' / 9';document.querySelectorAll('.nav button').forEach((b,i)=>b.setAttribute('aria-current',i===state.index?'step':'false'));window.scrollTo({top:0,behavior:'smooth'})}
function reset(){if(confirm('Clear progress for a new student?')){localStorage.removeItem('autumnclub-a2');location.reload()}}
const twists=[['🦖','A dinosaur enters KFC!'],['🎃','Your pumpkin starts talking!'],['🍔','A burger steals your phone!'],['🛸','Aliens land at McDonald’s!'],['🐿️','A squirrel eats your cinema tickets!']];
function roll(){state.roll=Math.floor(Math.random()*twists.length);save();document.getElementById('emoji').textContent=twists[state.roll][0];document.getElementById('twist').textContent=twists[state.roll][1]}
document.getElementById('nav').innerHTML=tasks.map((t,i)=>'<button onclick="go('+i+')">'+(i+1)+'. '+t[1]+'</button>').join('');
document.getElementById('content').innerHTML=tasks.map((t,i)=>'<section><b>'+t[0]+' · '+t[2]+'</b><h2>'+t[1]+'</h2>'+t[3]+'<div class="actions"><button onclick="go('+Math.max(0,i-1)+')">← Previous</button><button onclick="go('+Math.min(tasks.length-1,i+1)+')">Next →</button></div></section>').join('');
document.getElementById('vocab').innerHTML=words.map(w=>'<div class="card"><span class="emoji">'+w[0]+'</span><b>'+w[1]+'</b><button data-say="'+w[1]+'">🔊 Listen</button></div>').join('');
document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
document.querySelectorAll('.choices').forEach((g,j)=>g.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.choices[j]=b.textContent;save();if(g.dataset.correct){let ok=b.textContent===g.dataset.correct;g.parentElement.querySelector('.feedback').textContent=ok?'Correct! Nice work.':'Try again. Open the hint if you need help.'}}));
document.querySelectorAll('[data-save]').forEach(t=>{t.value=state.answers[t.dataset.save]||'';t.addEventListener('input',()=>{state.answers[t.dataset.save]=t.value;save()})});
document.querySelectorAll('.choices').forEach((g,j)=>{if(state.choices[j]){let b=[...g.querySelectorAll('button')].find(b=>b.textContent===state.choices[j]);if(b)b.classList.add('sel')}});
if(state.roll>=0){document.getElementById('emoji').textContent=twists[state.roll][0];document.getElementById('twist').textContent=twists[state.roll][1]}go(state.index);
</script></body></html>
