['8 min','THE AUTUMN VIBE','Warm-up',`<p>Would you rather stay home or go out with friends during the holidays? Why?</p><div class="choices" data-pick="mood"><button>🍿 Movie night</button><button>🍔 Fast food trip</button><button>🎮 Gaming marathon</button><button>🎃 Halloween party</button></div><div class="task"><b>LANGUAGE DETECTIVE: AUTUMN / FALL / COLD</b><p><b>Autumn</b> is the season (common in British English). <b>Fall</b> means the same season (especially American English). <b>Cold</b> describes the temperature, not a season. It can be cold in autumn, winter or spring!</p><p>Choose the word that is NOT a season name.</p><div class="choices" data-correct="cold"><button>autumn</button><button>fall</button><button>cold</button></div><p class="feedback"></p><details><summary>Need a hint?</summary>One word describes temperature.</details><p><button onclick="say('Autumn and fall mean the same season. Cold describes the weather.')">🔊 Listen to the explanation</button></p><p><b>STUDENT TURN:</b> Is autumn cold where you live? What is your favourite season?</p></div><div class="tutor">STUDENT TURN: Explain your choice in two sentences. TUTOR FOLLOW-UP: What would make this day perfect?</div>`],
['14','THE HOLIDAY MENU','18 activities · recognise → recall → use','<p>Build your holiday vocabulary. Tap each card to hear it, then play the sentence builder.</p><div class="cards" id="vocab"></div><div class="task"><b>⚡ SENTENCE BUILDER</b><p>Put the chunks in the correct order.</p><div id="buildPrompt"></div><div class="choices" id="buildWords"></div><p id="builtSentence" aria-live="polite"></p><button onclick="checkBuild()">Check</button> <button onclick="newBuild()">New sentence ↻</button> <button onclick="clearBuild()">Try again</button><p id="buildFeedback" class="feedback" aria-live="polite"></p><details><summary>Need a hint?</summary>Start with a subject. Then use am / is / are going to + activity.</details></div><div class="task"><b>YOUR TURN</b><p>Choose four activities: two things you usually do and two things you are going to do.</p><textarea data-save="vocabsentences" placeholder="I usually hang out with my friends. Next weekend I am going to..."></textarea></div><div class="tutor">STUDENT TURN: Which activity is overrated? Which is underrated? TUTOR FOLLOW-UP: Why? When? With whom? EXTRA CHALLENGE: Add a reason using because.</div>'],
['15','THE BURGER BATTLE','Real-life role-play · opinions & ordering','<p><b>BREAKING NEWS:</b> You have £15, three hungry friends and 20 minutes. Everyone wants something different. Can you negotiate a plan?</p><div class="cards"><div class="card"><span class="emoji">🍔</span><b>Burger place</b>burger £6 · fries £3 · drink £2</div><div class="card"><span class="emoji">🍗</span><b>Chicken place</b>wrap £5 · wings £6 · drink £2</div><div class="card"><span class="emoji">🍕</span><b>Pizza place</b>slice £4 · whole pizza £12 · water £1</div><div class="card"><span class="emoji">🥗</span><b>Other option</b>salad £6 · sandwich £5 · juice £3</div></div><div class="task"><b>ORDERING CHALLENGE</b><p>Which sentence is polite and natural?</p><div class="choices" data-correct="Could I have a chicken wrap, please?"><button>Give me chicken now!</button><button>Could I have a chicken wrap, please?</button><button>I having a chicken wrap.</button></div><p class="feedback" aria-live="polite"></p><details><summary>Need a hint?</summary>Use Could I have …, please?</details></div><div class="task"><b>BUILD YOUR ORDER</b><p>Choose food and write a short order. The prices are fictional, for language practice.</p><textarea data-save="burgerorder" placeholder="Could I have ... and ..., please? How much is that?"></textarea></div><div class="tutor">ROLE-PLAY: Tutor = cashier; student = customer. Switch roles. Use: I\'d like… / Could I have…? / Anything else? / That\'s £… / Here you are. TUTOR FOLLOW-UP: Your friend is vegetarian. Change the order.</div><div class="task"><b>DEBATE CLUB</b><p>Which is better: a cheap takeaway or cooking with friends? Give 3 reasons, then disagree politely.</p><textarea data-save="burgerdebate" placeholder="In my opinion... First... Also... However..."></textarea></div>'],
['23','BACK TO LAST AUTUMN','Past Simple · story → notice → practise → tell','<p><b>THE CASE OF THE MISSING BURGER 🍔</b> Listen first. Then reveal the story and find all the past-tense verbs.</p><button onclick="say(story)">🔊 Listen to the full story</button><details><summary>📖 Reveal the story</summary><p>Last October, Jamie and Mia planned a perfect Saturday. They met at the bus stop at eleven, but the bus was late. They walked to the shopping centre instead. Jamie bought a ridiculous pumpkin hat, and Mia took a photo. At lunchtime, they ordered two burgers and some chips. Suddenly, Jamie\'s burger disappeared! They looked under the table and asked the waiter for help. Then they saw a small dog near the door. The dog had the burger box, but the burger was still inside. Everyone laughed. The waiter gave Jamie a fresh burger. In the evening, the friends watched a scary film. Jamie didn\'t sleep well, but he said it was the funniest day of the holidays.</p></details><div class="task"><b>READING DETECTIVE</b><p>Where did Jamie and Mia meet?</p><div class="choices" data-correct="At the bus stop"><button>At the bus stop</button><button>At school</button><button>At the cinema</button></div><p class="feedback" aria-live="polite"></p><p>Who had the burger box?</p><div class="choices" data-correct="A small dog"><button>A waiter</button><button>A small dog</button><button>Mia</button></div><p class="feedback" aria-live="polite"></p></div><div class="task"><b>PAST SIMPLE LAB</b><p>Regular verbs: plan → planned, walk → walked, order → ordered, laugh → laughed. Irregular verbs: meet → met, buy → bought, take → took, see → saw, give → gave.</p><p><b>Affirmative:</b> They watched a film. <b>Negative:</b> Jamie didn\'t sleep well. <b>Question:</b> Did they order burgers? — Yes, they did.</p><p><b>Notice:</b> after did / didn\'t, use the base form: Did they <b>go</b>? Not "Did they went?"</p><div class="choices" data-correct="Did they buy a hat?"><button>Did they bought a hat?</button><button>Did they buy a hat?</button><button>They did bought a hat?</button></div><p class="feedback" aria-live="polite"></p><details><summary>Need a hint?</summary>Did + subject + base verb.</details></div><div class="task"><b>YOUR MINI-STORY</b><p>Use: Last weekend… / First… / Then… / After that… / Suddenly… / In the end… / It was…</p><textarea data-save="paststory" placeholder="Last weekend I... First... Then... Suddenly... In the end..."></textarea><button onclick="say(document.querySelector(\'[data-save=paststory]\').value)">🔊 Hear my story</button></div><div class="tutor">STUDENT TURN: Tell a true or invented story with 6 past-tense verbs. TUTOR FOLLOW-UP: What happened next? Did you enjoy it? Why? EXTRA CHALLENGE: Include a negative and two Did…? questions.</div>'],
['23','HALLOWEEN AROUND THE WORLD','UK · USA · Australia · Bonfire Night','<p>Same date, different traditions! Compare three English-speaking countries. Not everyone celebrates in the same way.</p><div class="cards"><div class="card"><span class="emoji">🇬🇧</span><b>UNITED KINGDOM</b><p>Halloween: 31 October. Some families carve pumpkins, dress up and go trick-or-treating. <b>Bonfire Night:</b> 5 November, especially associated with Guy Fawkes and the 1605 Gunpowder Plot. Organised fireworks displays are common.</p></div><div class="card"><span class="emoji">🇺🇸</span><b>UNITED STATES</b><p>Halloween is widely celebrated with costumes, decorated houses, trick-or-treating and parties. Bonfire Night on 5 November is not a major national tradition.</p></div><div class="card"><span class="emoji">🇦🇺</span><b>AUSTRALIA</b><p>Halloween is growing in popularity, but participation varies. <b>October is spring</b> in Australia, not autumn! Bonfire Night is not a major national holiday.</p></div></div><div class="task"><b>CULTURE QUIZ</b><p>Where is October a spring month?</p><div class="choices" data-correct="Australia"><button>United Kingdom</button><button>United States</button><button>Australia</button></div><p class="feedback" aria-live="polite"></p><p>Which event is linked to the Gunpowder Plot?</p><div class="choices" data-correct="Bonfire Night"><button>Bonfire Night</button><button>Halloween</button><button>Thanksgiving</button></div><p class="feedback" aria-live="polite"></p><details><summary>Need a hint?</summary>Remember the hemispheres and 5 November.</details></div><div class="task"><b>CULTURE VOCAB</b><p>costume · pumpkin · carve · trick-or-treat · bonfire · fireworks · tradition · celebrate · spooky · neighbourhood · spring · autumn</p><button onclick="say(\'Costume. Pumpkin. Carve. Trick or treat. Bonfire. Fireworks. Tradition. Celebrate. Spooky. Neighbourhood. Spring. Autumn.\')">🔊 Listen & repeat</button></div><div class="task"><b>COMPARE & CONTRAST</b><p>Complete the comparison using <i>both, but, however, unlike, whereas</i>.</p><textarea data-save="culturecompare" placeholder="Both the UK and the USA... However, in Australia... Unlike the USA, the UK..."></textarea></div><div class="tutor">STUDENT TURN: Would you rather go trick-or-treating or watch a fireworks display? Give reasons. ASK YOUR TUTOR: What festivals do people celebrate where you live? TUTOR NOTE: Discuss fireworks safety without suggesting unsupervised use.</div><p><a href="https://learnenglishkids.britishcouncil.org/category/topics/halloween" target="_blank" rel="noopener noreferrer">Explore British Council Halloween activities ↗</a> · <a href="https://www.bbc.co.uk/bitesize" target="_blank" rel="noopener noreferrer">BBC Bitesize cultural learning ↗</a></p>'],
['20','FUTURE YOU','Going to · intentions · decisions · interviews','<p><b>THE HOLIDAY FORECAST:</b> You have five free days. What are you going to do?</p><div class="task"><b>GUIDED DISCOVERY</b><p>I\'m going to visit my cousins. She isn\'t going to stay home. Are you going to watch a film? — Yes, I am.</p><p>What comes after <b>going to</b>?</p><div class="choices" data-correct="the base form of the verb"><button>the past form</button><button>the base form of the verb</button><button>verb + -ing</button></div><p class="feedback" aria-live="polite"></p><details><summary>Grammar map & hint</summary>I <b>am</b> / he, she, it <b>is</b> / we, you, they <b>are</b> + going to + base verb. Negative: isn\'t / aren\'t going to. Question: Are you going to…?</details></div><div class="task"><b>MAKE IT NEGATIVE</b><p>She is going to visit a museum. → She ___ going to visit a museum.</p><div class="choices" data-correct="isn\'t"><button>don\'t</button><button>isn\'t</button><button>didn\'t</button></div><p class="feedback" aria-live="polite"></p></div><div class="task"><b>FIVE-DAY PLANNER</b><p>Write 5 plans, 2 things you aren\'t going to do, and 2 questions for your tutor.</p><textarea data-save="fiveplans" placeholder="On Monday, I\'m going to... I\'m not going to... Are you going to...?"></textarea></div><div class="task"><b>THE SURPRISE PHONE CALL</b><p>Your friend says: “Our cinema tickets are sold out!” Change your plans. Explain your new plan and give a reason.</p><textarea data-save="newplan" placeholder="We aren\'t going to... Instead, we\'re going to... because..."></textarea></div><div class="tutor">STUDENT TURN: Interview your tutor about weekend plans. TUTOR FOLLOW-UP: Who are you going with? Where are you going to meet? What time? EXTRA CHALLENGE: Compare two plans and choose the better one.</div>'],

];let score20=0;function setup20(){const el=document.getElementById('quiz20');if(!el)return;el.innerHTML=questions.map((q,i)=>'<div class="task"><b>MISSION '+(i+1)+'/20</b><p>'+q[0]+'</p><div class="choices" data-q20="'+i+'">'+q[2].split('|').map(x=>'<button>'+x+'</button>').join('')+'</div><p class="feedback" aria-live="polite"></p><details><summary>Need a hint?</summary>Look for the time expression and check whether the sentence is a question or a negative.</details></div>').join('')+'<p id="score20" class="feedback" aria-live="polite">Score: 0 / 20</p>';el.querySelectorAll('[data-q20]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+g.dataset.q20,ok=b.textContent===questions[i][1];g.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));g.parentElement.querySelector('.feedback').textContent=ok?'✓ Correct!':'Try again. Check the time marker and verb form.';g.dataset.passed=ok?'1':'0';score20=el.querySelectorAll('[data-passed="1"]').length;document.getElementById('score20').textContent='Score: '+score20+' / 20';save()}))}
