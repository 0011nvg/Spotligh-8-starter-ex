<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolya's Zone — Autumn Break</title><style>
:root{--cream:#F7F4ED;--blue:#3D3BFF;--pink:#FF4FA3;--yellow:#FFD400;--ink:#171717}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,sans-serif}button,input,textarea{font:inherit}button,a.action{cursor:pointer;border:2px solid #111;border-radius:14px;padding:12px 16px;background:white;color:#111;font-weight:800;min-height:46px}button:hover,a.action:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:4px solid var(--pink);outline-offset:2px}header{position:sticky;top:0;background:var(--cream);border-bottom:3px solid #111;z-index:2;padding:12px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;gap:14px;flex-wrap:wrap}header a{color:var(--blue);font-weight:900}progress{width:140px;height:16px;accent-color:var(--blue)}main{max-width:1100px;margin:auto;padding:20px 16px 70px}.hero{background:var(--yellow);border:3px solid #111;border-radius:30px;padding:clamp(24px,6vw,65px);position:relative;overflow:hidden}.hero:after{content:"🍔 🎮 🍂";display:block;font-size:clamp(55px,9vw,110px);transform:rotate(-8deg);text-align:right}h1{font-size:clamp(52px,9vw,112px);line-height:.92;letter-spacing:-.06em;margin:18px 0}h2{font-size:clamp(32px,5vw,56px);line-height:1;margin:8px 0 18px}.eyebrow{font-weight:950;letter-spacing:.14em}.lead{font-size:21px;max-width:660px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.nav button{background:#fff}.panel{display:none;background:#fff;border:3px solid #111;border-radius:26px;padding:clamp(20px,4vw,38px);min-height:490px}.panel.active{display:block}.meta{font-size:13px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.1em}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:2px solid #111;border-radius:18px;padding:18px;background:var(--cream)}.card .emoji{font-size:50px}.card b{display:block;font-size:19px}.card button{margin-top:12px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.choices button.selected{background:var(--yellow)}.good{color:#07643c;font-weight:850}.bad{color:#a01839;font-weight:850}.task{border-left:7px solid var(--blue);background:#f5f3ff;padding:20px;margin:18px 0;border-radius:10px}.task p{font-size:18px}.task input,.task textarea{width:100%;padding:12px;border:2px solid #111;border-radius:10px;min-height:48px}.task textarea{min-height:120px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hint{display:none;background:#fff0aa;border:2px solid #111;border-radius:12px;padding:14px;margin-top:12px}.hint.show{display:block}.tutor{background:#171717;color:white;border-radius:15px;padding:16px;margin-top:20px}.tutor strong{color:var(--yellow)}.sticker{display:inline-block;background:var(--pink);border:2px solid #111;padding:7px 12px;transform:rotate(-3deg);font-weight:900}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.footer button{background:var(--yellow)}.video{padding:18px;border:2px dashed #111;border-radius:16px}.small{font-size:13px;color:#555}@media(max-width:720px){.cards{grid-template-columns:1fr}.panel{min-height:0}header{position:static}.hero:after{text-align:left}.nav button{flex:1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header><a href="../index.html">← SPOTLIGHT 8</a><strong>🍟 KOLYA'S ZONE</strong><span id="counter">Mission 1 / 9</span><progress id="progress" max="9" value="1"></progress><button onclick="resetAll()">New student / Reset all</button></header><main><section class="hero"><span class="sticker">90-MINUTE ADVENTURE</span><p class="eyebrow">SPECIAL EDITION · AUTUMN 2026</p><h1>NO SCHOOL.<br>BIG PLANS!</h1><p class="lead">The holiday planning department is in trouble. The squirrel has eaten the timetable. Can you save your autumn break?</p><button onclick="show(0)">START THE MISSION →</button></section><nav id="nav"></nav><div id="stages"></div></main><script>
const stages=[
{time:8,title:"BREAKING NEWS!",subtitle:"Warm-up · Your holiday mood",body:`<p>School finishes soon. Your mission: choose the perfect holiday mood.</p><div class="choices" data-choice="mood"><button>🍔 Hungry hero</button><button>🎮 Gaming legend</button><button>😴 Sleep champion</button><button>⚽ Football star</button></div><div class="task"><b>STUDENT TURN</b><p>How do you feel about the holidays? Why?</p><button onclick="speak('I am excited about the holidays!')">🔊 Listen to a model</button></div><div class="tutor"><strong>TUTOR FOLLOW-UP</strong> What's better: a day without homework or unlimited chicken nuggets? Explain!</div>`},
{time:12,title:"THE HOLIDAY MENU",subtitle:"Vocabulary · Recognise → recall",body:`<p>Meet your holiday action verbs. Tap the speaker, listen and repeat.</p><div class="cards" id="words"></div><div class="task"><b>MEMORY TEST</b><p>Close your eyes. Can you remember four activities without looking?</p><button onclick="speak('I want to play video games and go to the cinema.')">🔊 Listen to a sentence</button></div><div class="tutor"><strong>ASK YOUR TUTOR</strong> Which activity do you like? Which activity is boring?</div>`},
{time:10,title:"FAST FOOD FACE-OFF",subtitle:"Speaking · Meaningful choices",body:`<p>Choose your dream lunch. The budget is imaginary. The hunger is real.</p><div class="choices" data-choice="food"><button>🍔 McDonald's burger</button><button>🍗 KFC chicken</button><button>🍕 Pizza</button><button>🥪 Homemade sandwich</button></div><div class="task"><b>BUILD YOUR SENTENCE</b><p>Complete: On holiday, I want to eat ... because ...</p><textarea data-save="foodSentence" placeholder="I want to eat ... because ..."></textarea></div><div class="tutor"><strong>TUTOR FOLLOW-UP</strong> Would you eat 100 nuggets for a million dollars? Why or why not?</div>`},
{time:12,title:"THE TIME MACHINE",subtitle:"Past Simple · Last holidays",body:`<p>Look at these messages from the past.</p><div class="cards"><div class="card"><span class="emoji">🎮</span><b>Yesterday I played games.</b></div><div class="card"><span class="emoji">🍕</span><b>Last week I ate pizza.</b></div><div class="card"><span class="emoji">🎬</span><b>Last summer I went to the cinema.</b></div></div><div class="task"><b>CHOOSE THE PAST</b><p>Last weekend I ___ to the park.</p><div class="choices" data-answer="went"><button>went</button><button>go</button><button>going</button></div><button onclick="checkChoice(this,'went')">Check</button><p class="feedback" aria-live="polite"></p><button onclick="hint(this)">Need a hint?</button><div class="hint">Last weekend = past. go → went.</div></div><div class="tutor"><strong>STUDENT TURN</strong> Tell me three true things about your last holidays. <strong>TUTOR FOLLOW-UP</strong> Who did you go with? Was it fun?</div>`},
{time:12,title:"FUTURE YOU",subtitle:"Be going to · Plans and intentions",body:`<p>Meet Future Kolya. He has BIG plans.</p><div class="card"><span class="emoji">😎</span><b>I'm going to play football.</b><p>I'm not going to do homework all day.</p><p>Are you going to visit your friends?</p></div><div class="task"><b>DISCOVER THE RULE</b><p>Which phrase tells us about a plan?</p><div class="choices" data-answer="am going to"><button>am going to</button><button>played</button><button>yesterday</button></div><button onclick="checkChoice(this,'am going to')">Check</button><p class="feedback" aria-live="polite"></p><button onclick="hint(this)">Need a hint?</button><div class="hint">Look at: I'm going to play football.</div></div><div class="task"><p>Complete: I ___ going to watch a film.</p><input data-answer="am" placeholder="Type one word"><div class="controls"><button onclick="checkInput(this)">Check</button><button onclick="hint(this)">Hint</button><button onclick="clearInput(this)">Try again</button></div><div class="hint">I + am + going to + verb</div><p class="feedback" aria-live="polite"></p></div><div class="tutor"><strong>PRONUNCIATION</strong> Say: I'm going to / I'm gonna (informal speech). Keep writing the full form. <strong>CCQ</strong> Is it a past event or a future plan?</div>`},
{time:10,title:"SQUIRREL GLITCH",subtitle:"Grammar game · Past or future?",body:`<p>Our squirrel mixed up the calendar! Fix these sentences.</p><div class="task"><p>1. Last Sunday I <b>go</b> to the park.</p><input data-answer="went" placeholder="Correct the verb"><div class="controls"><button onclick="checkInput(this)">Check</button><button onclick="hint(this)">Hint</button><button onclick="clearInput(this)">Try again</button></div><div class="hint">Past of go is irregular.</div><p class="feedback" aria-live="polite"></p></div><div class="task"><p>2. Tomorrow I <b>played</b> video games. (Use going to.)</p><input data-answer="am going to play" placeholder="Correct the verb phrase"><div class="controls"><button onclick="checkInput(this)">Check</button><button onclick="hint(this)">Hint</button><button onclick="clearInput(this)">Try again</button></div><div class="hint">I + am going to + base verb.</div><p class="feedback" aria-live="polite"></p></div><div class="tutor"><strong>EXTRA CHALLENGE</strong> Make one funny past sentence and one funny future plan.</div>`},
{time:10,title:"THE CHAOS GENERATOR",subtitle:"Random game · Speaking",body:`<p>Roll the chaos machine and invent a silly holiday story!</p><div class="card"><div style="font-size:54px" id="chaosEmoji">🎲</div><h2 id="chaosText">Ready?</h2><button onclick="roll()">ROLL THE CHAOS!</button></div><div class="task"><b>STUDENT TURN</b><p>Say two sentences: one about yesterday and one about tomorrow.</p><p class="small">Example: Yesterday I ate a giant pizza. Tomorrow I'm going to visit the moon.</p></div><div class="tutor"><strong>SWITCH ROLES</strong> The tutor rolls and the student asks: What did you do? What are you going to do?</div>`},
{time:10,title:"BUILD THE ULTIMATE BREAK",subtitle:"Final mission · Communicate",body:`<p>You are the boss of your holiday. Design three days and convince your tutor that your plan is amazing.</p><div class="task"><b>MY 3-DAY PLAN</b><textarea data-save="plan" placeholder="On Monday, I'm going to...&#10;On Tuesday, I'm going to...&#10;On Wednesday, I'm going to..."></textarea><div class="controls"><button onclick="hint(this)">Need a hint?</button><button onclick="speak('On Monday, I am going to visit my friends. On Tuesday, I am going to play football.')">🔊 Model</button></div><div class="hint">Try: visit my friends, watch a film, play games, eat pizza, ride my bike, go to the cinema.</div></div><div class="tutor"><strong>FINAL SPEAKING CHALLENGE</strong> Ask three follow-up questions: Why? Who with? What if it rains? No automatic marking: discuss the plan together.</div>`},
{time:6,title:"MISSION COMPLETE!",subtitle:"Exit ticket · Reflect",body:`<p>🏆 You survived the squirrel, the grammar glitches and the imaginary nugget crisis.</p><div class="task"><b>EXIT TICKET</b><p>Say one thing you did last holidays, two things you're going to do next holidays and one new word you remember.</p><textarea data-save="exit" placeholder="Last holidays, I... Next holidays, I'm going to..."></textarea></div><div class="choices" data-choice="confidence"><button>😎 I can do it!</button><button>🙂 Almost there</button><button>🧠 I need more practice</button></div><div class="tutor"><strong>TUTOR NOTE</strong> Give feedback on one successful past form, one successful going-to plan and one pronunciation target. Optional extra practice: revisit any previous mission.</div><div class="video"><b>OPTIONAL VIDEO / EXTRA PRACTICE</b><p>Explore holiday videos and activities on British Council LearnEnglish Kids.</p><a class="action" target="_blank" rel="noopener noreferrer" href="https://learnenglishkids.britishcouncil.org/category/topics/holidays">Open holiday activities ↗</a><p class="small">External material is optional; the core lesson works without it.</p></div>`}
];
const words=[["🎮","play video games"],["⚽","play football"],["🎬","go to the cinema"],["🚲","ride my bike"],["🍕","eat pizza"],["👫","visit friends"],["🍂","go to the park"],["🍿","watch a film"],["😴","sleep late"]];
const key="kolya-autumn-v2";let state={index:0,answers:{},choices:{},roll:null};try{state={...state,...JSON.parse(localStorage.getItem(key)||"{}")}}catch(e){}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function speak(s){if(!('speechSynthesis' in window)){alert('Speech is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}
function show(i){state.index=Math.max(0,Math.min(8,i));save();document.querySelectorAll('.panel').forEach((x,j)=>x.classList.toggle('active',j===state.index));document.querySelectorAll('.nav button').forEach((x,j)=>x.setAttribute('aria-current',j===state.index?'step':'false'));document.getElementById('counter').textContent='Mission '+(state.index+1)+' / 9';document.getElementById('progress').value=state.index+1;document.querySelector('.nav').scrollIntoView({behavior:'smooth',block:'start'})}
function hint(btn){let h=btn.closest('.task').querySelector('.hint');h.classList.toggle('show')}
function clearInput(btn){let t=btn.closest('.task');t.querySelector('input').value='';t.querySelector('.feedback').textContent='';t.querySelector('input').focus()}
function checkInput(btn){let t=btn.closest('.task'),inp=t.querySelector('input'),v=inp.value.toLowerCase().trim().replace(/\s+/g,' '),ok=v===inp.dataset.answer;let f=t.querySelector('.feedback');f.textContent=ok?'Correct! You saved the timeline!':'Not quite. Try again or open a hint.';f.className='feedback '+(ok?'good':'bad')}
function checkChoice(btn,ans){let t=btn.closest('.task'),selected=t.querySelector('button.selected'),ok=selected&&selected.textContent.trim()===ans;let f=t.querySelector('.feedback');f.textContent=!selected?'Choose an answer first.':ok?'Great work!':'Try again. Check the time expression.';f.className='feedback '+(ok?'good':'bad')}
const chaos=[['🍔','A burger the size of a car'],['🐿️','A squirrel steals your homework'],['🎮','A video game comes to life'],['⚽','A football match on the moon'],['🍗','A chicken nugget detective'],['🛸','Aliens visit McDonald’s'],['🦖','A dinosaur at the cinema']];
function roll(){let n=Math.floor(Math.random()*chaos.length);state.roll=n;save();document.getElementById('chaosEmoji').textContent=chaos[n][0];document.getElementById('chaosText').textContent=chaos[n][1]}
function resetAll(){if(!confirm('Clear all answers and start with a new student?'))return;localStorage.removeItem(key);location.reload()}
document.getElementById('nav').innerHTML=stages.map((s,i)=>'<button onclick="show('+i+')">'+(i+1)+'. '+s.title+'</button>').join('');
document.getElementById('stages').innerHTML=stages.map((s,i)=>'<section class="panel" id="stage'+i+'"><div class="meta">Mission '+(i+1)+' / 9 · '+s.time+' minutes · '+s.subtitle+'</div><h2>'+s.title+'</h2>'+s.body+'<div class="footer"><button onclick="show('+Math.max(0,i-1)+')">← Previous</button><button onclick="show('+Math.min(8,i+1)+')">'+(i===8?'Finish ✓':'Next mission →')+'</button></div></section>').join('');
document.getElementById('words').innerHTML=words.map(w=>'<div class="card"><span class="emoji">'+w[0]+'</span><b>'+w[1]+'</b><button data-say="'+w[1]+'">🔊 Listen</button></div>').join('');
document.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.say)));
document.querySelectorAll('.choices').forEach(group=>group.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;group.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(group.dataset.choice){state.choices[group.dataset.choice]=b.textContent;save()}}));
document.querySelectorAll('[data-save]').forEach(el=>{el.value=state.answers[el.dataset.save]||'';el.addEventListener('input',()=>{state.answers[el.dataset.save]=el.value;save()})});
document.querySelectorAll('[data-choice]').forEach(group=>{let v=state.choices[group.dataset.choice];if(v)[...group.querySelectorAll('button')].find(b=>b.textContent===v)?.classList.add('selected')});
if(state.roll!==null){document.getElementById('chaosEmoji').textContent=chaos[state.roll][0];document.getElementById('chaosText').textContent=chaos[state.roll][1]}
show(state.index);
</script></body></html>
